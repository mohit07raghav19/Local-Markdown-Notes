<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #1e1e1e;
        color: #d4d4d4;
      }

      .header {
        background: #252526;
        padding: 12px;
        border-bottom: 1px solid #3e3e42;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 6px 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: background 0.2s;
      }

      .btn-primary {
        background: #0e639c;
        color: white;
      }

      .btn-primary:hover {
        background: #1177bb;
      }

      .btn-secondary {
        background: #3e3e42;
        color: #d4d4d4;
      }

      .btn-secondary:hover {
        background: #505050;
      }

      .btn-success {
        background: #0e7c0e;
        color: white;
      }

      .btn-success:hover {
        background: #109010;
      }

      .editor-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #editor {
        flex: 1;
        width: 100%;
        padding: 16px;
        border: none;
        background: #1e1e1e;
        color: #d4d4d4;
        font-family: "Consolas", "Courier New", monospace;
        font-size: 14px;
        line-height: 1.6;
        resize: none;
        outline: none;
      }

      #editor::placeholder {
        color: #6a6a6a;
      }

      .filename-input {
        flex: 1;
        padding: 6px 12px;
        background: #3c3c3c;
        border: 1px solid #3e3e42;
        border-radius: 4px;
        color: #d4d4d4;
        font-size: 13px;
        outline: none;
      }

      .filename-input:focus {
        border-color: #0e639c;
      }

      .status {
        padding: 8px 12px;
        background: #252526;
        border-top: 1px solid #3e3e42;
        font-size: 12px;
        color: #858585;
      }

      .preview {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        background: #1e1e1e;
      }

      .preview img {
        max-width: 100%;
        border-radius: 4px;
        margin: 8px 0;
      }

      .preview h1,
      .preview h2,
      .preview h3 {
        margin-top: 16px;
        margin-bottom: 8px;
        color: #d4d4d4;
      }

      .preview p {
        margin-bottom: 12px;
      }

      .preview code {
        background: #2d2d30;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: "Consolas", monospace;
      }

      .preview pre {
        background: #2d2d30;
        padding: 12px;
        border-radius: 4px;
        overflow-x: auto;
        margin: 12px 0;
      }

      .preview a {
        color: #4fc3f7;
        text-decoration: none;
      }

      .preview a:hover {
        text-decoration: underline;
      }

      .split-view {
        display: flex;
        height: 100%;
      }

      .split-view .editor-container,
      .split-view .preview {
        flex: 1;
        border-right: 1px solid #3e3e42;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <input
        type="text"
        id="filename"
        class="filename-input"
        placeholder="note-name"
        value="notes" />
      <button
        id="screenshotBtn"
        class="btn btn-primary"
        title="Capture screenshot with timestamp">
        📸 Screenshot
      </button>
      <button id="toggleView" class="btn btn-secondary">👁️ Preview</button>
      <button id="clearBtn" class="btn btn-secondary">🗑️ Clear</button>
      <button id="exportBtn" class="btn btn-success">📦 Export ZIP</button>
    </div>

    <div class="editor-container">
      <textarea
        id="editor"
        placeholder="# Start taking notes here...

Use markdown syntax:
- **bold** or *italic*
- # Headings
- [links](url)
- `code`

Click Screenshot to capture the page with timestamp!"></textarea>
    </div>

    <div id="preview" class="preview hidden"></div>

    <div class="status">
      <span id="statusText">Ready</span>
    </div>

    <script src="lib/jszip.min.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
