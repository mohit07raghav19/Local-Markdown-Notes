<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #1e1e1e;
        color: #d4d4d4;
      }

      .header {
        background: #252526;
        padding: 12px;
        border-bottom: 1px solid #3e3e42;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 6px 8px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: background 0.2s;
      }

      .btn img,
      .btn svg {
        width: 16px;
        height: 16px;
        vertical-align: middle;
        display: inline-block;
        margin-right: 6px;
      }

      .kbd {
        display: inline-block;
        font-size: 11px;
        padding: 2px 6px;
        margin-left: 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.04);
        color: #cfcfcf;
        border: 1px solid rgba(255, 255, 255, 0.03);
      }

      .sr-only {
        position: absolute !important;
        height: 1px;
        width: 1px;
        overflow: hidden;
        clip: rect(1px, 1px, 1px, 1px);
        white-space: nowrap;
        border: 0;
        padding: 0;
        margin: -1px;
      }

      .btn-primary {
        background: #0e639c;
        color: white;
      }

      .btn-primary:hover {
        background: #1177bb;
      }

      .btn-secondary {
        background: #3e3e42;
        color: #d4d4d4;
      }

      .btn-secondary:hover {
        background: #505050;
      }

      .btn-success {
        background: #0e7c0e;
        color: white;
      }

      .btn-success:hover {
        background: #109010;
      }

      .editor-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #editor {
        flex: 1;
        width: 100%;
        padding: 16px;
        border: none;
        background: #1e1e1e;
        color: #d4d4d4;
        font-family: "Consolas", "Courier New", monospace;
        font-size: 14px;
        line-height: 1.6;
        resize: none;
        outline: none;
      }

      #editor::placeholder {
        color: #6a6a6a;
      }

      .filename-input {
        flex: 1;
        padding: 6px 12px;
        background: #3c3c3c;
        border: 1px solid #3e3e42;
        border-radius: 4px;
        color: #d4d4d4;
        font-size: 13px;
        outline: none;
      }

      .filename-input:focus {
        border-color: #0e639c;
      }

      .status {
        padding: 8px 12px;
        background: #252526;
        border-top: 1px solid #3e3e42;
        font-size: 12px;
        color: #858585;
      }

      .preview {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        background: #1e1e1e;
      }

      .preview img {
        max-width: 100%;
        border-radius: 4px;
        margin: 8px 0;
      }

      .preview h1,
      .preview h2,
      .preview h3 {
        margin-top: 16px;
        margin-bottom: 8px;
        color: #d4d4d4;
      }

      .preview p {
        margin-bottom: 12px;
      }

      .preview code {
        background: #2d2d30;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: "Consolas", monospace;
      }

      .preview pre {
        background: #2d2d30;
        padding: 12px;
        border-radius: 4px;
        overflow-x: auto;
        margin: 12px 0;
      }

      .preview a {
        color: #4fc3f7;
        text-decoration: none;
      }

      .preview a:hover {
        text-decoration: underline;
      }

      .split-view {
        display: flex;
        height: 100%;
      }

      .split-view .editor-container,
      .split-view .preview {
        flex: 1;
        border-right: 1px solid #3e3e42;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <input
          type="text"
          id="filename"
          class="filename-input"
          placeholder="note-name"
          value="notes" />
      </div>

      <button
        id="screenshotBtn"
        class="btn btn-primary"
        title="Capture screenshot with timestamp">
        <!-- camera SVG -->
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true">
          <path
            d="M3 7h3l2-2h8l2 2h3v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7z"
            stroke="#d4d4d4"
            stroke-width="1.2"
            stroke-linecap="round"
            stroke-linejoin="round" />
          <circle cx="12" cy="13" r="3" stroke="#d4d4d4" stroke-width="1.2" />
        </svg>
        <span class="sr-only">Screenshot</span>
        <span class="kbd">Opt+O</span>
      </button>
      <!-- Images button removed from header. Images control lives below the status area. -->

      <button id="toggleView" class="btn btn-secondary" title="Toggle preview">
        <!-- eye SVG -->
        Preview
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true">
          <path
            d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"
            stroke="#d4d4d4"
            stroke-width="1.2"
            stroke-linecap="round"
            stroke-linejoin="round" />
          <circle cx="12" cy="12" r="3" stroke="#d4d4d4" stroke-width="1.2" />
        </svg>
        <span class="sr-only">Preview</span>
      </button>

      <button id="clearBtn" class="btn btn-secondary" title="Clear notes">
        <!-- trash SVG -->
        Clear
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true">
          <path
            d="M3 6h18"
            stroke="#d4d4d4"
            stroke-width="1.2"
            stroke-linecap="round" />
          <path
            d="M8 6V4h8v2"
            stroke="#d4d4d4"
            stroke-width="1.2"
            stroke-linecap="round" />
          <path
            d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"
            stroke="#d4d4d4"
            stroke-width="1.2"
            stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        <span class="sr-only">Clear</span>
      </button>
      <button id="exportBtn" class="btn btn-secondary" title="Export notes">
        Export
        <svg
          class="w-6 h-6 text-gray-800 dark:text-white"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24">
          <path
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 15v2a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-2M12 4v12m0-12 4 4m-4-4L8 8" />
        </svg>
      </button>
    </div>

    <div class="editor-container">
      <textarea
        id="editor"
        placeholder="# Local Markdown Notes
— Features
- Sidebar Markdown editor (auto-save)
- Capture screenshots (Alt/Option+O) 
— YouTube timestamps auto-attached
- Paste images directly from clipboard
- Preview rendered markdown (toggle)
- Export as ZIP (.md + images/)

Start typing your notes...

         "></textarea>
    </div>

    <div id="preview" class="preview hidden"></div>

    <div class="status">
      <span id="statusText">Ready</span>
    </div>

    <!-- Compact Images control below status -->
    <div
      style="
        padding: 8px 12px;
        border-top: 1px solid #3e3e42;
        background: #151515;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      ">
      <div style="display: flex; align-items: center; gap: 8px">
        <strong style="font-size: 13px">Images</strong>
        <span id="imagesCountHeader" style="font-size: 12px; color: #9a9a9a"
          >0</span
        >
      </div>
      <div>
        <button
          id="imagesToggleBtn"
          class="btn btn-secondary"
          title="Show images"
          aria-expanded="false">
          Show ▾
        </button>
      </div>
    </div>
    <style>
      .images-expand {
        border-top: 1px solid rgba(255, 255, 255, 0.04);
        padding: 8px;
        background: #151515;
        max-height: 220px;
        overflow: auto;
      }
      .images-expand-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .images-expand-list {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .images-expand-item {
        width: 120px;
        background: #111;
        border-radius: 6px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .images-expand-item img {
        width: 100%;
        height: 68px;
        object-fit: cover;
        border-radius: 4px;
      }
      .images-expand-item .meta {
        font-size: 11px;
        color: #ddd;
        text-align: center;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .images-expand-item .actions {
        display: flex;
        gap: 6px;
      }
    </style>

    <!-- Images expandable panel (collapsed by default) -->
    <div id="imagesExpandable" class="images-expand hidden" aria-live="polite">
      <div id="imagesExpandableList" class="images-expand-list"></div>
    </div>

    <!-- Inline scripts removed for CSP compatibility. Filename preview and other UI initialization moved into sidepanel.js -->

    <script src="lib/jszip.min.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
